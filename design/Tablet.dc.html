<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg:#0b1120; --panel:#131c2e; --panel-2:#1a2437; --line:#26324a;
      --ink:#eef2f8; --ink-dim:#8b9ab4; --ink-faint:#5d6b85;
      --accent:#34d399; --accent-dk:#0f7f5f; --warn:#fbbf24; --danger:#f87171;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
              "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
              "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
           font-family:var(--font); font-size:16px; line-height:1.45; }
    a { color:#34d399; } a:hover { color:#6ee7b7; }
  </style>
</helmet>

<!-- Docked Pixel Tablet, landscape, 1280x800. The ribbon spans BOTH columns
     (grid-column: 1 / -1) and everything else keeps the existing 5fr/6fr
     split. Content width 1248 puts the ribbon at 1246px inner. -->
<div style="width: 1280px; min-height: 800px; background: var(--bg); font-family: var(--font);">

  <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px; background:rgba(11,17,32,0.86); border-bottom:1px solid var(--line);">
    <span style="font-family: var(--mono); font-size: 13px; letter-spacing:.10em; text-transform:uppercase; color: var(--ink-dim);">hindsight</span>
    <span style="font-family: var(--mono); font-size: 12px; color: var(--accent);">● live · 8ch @ 48k</span>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0,5fr) minmax(0,6fr); gap: 16px; align-items: start; padding: 18px 16px 48px;">

    <!-- full-bleed ribbon across both columns -->
    <div style="grid-column: 1 / -1; position: relative; height: 190px; background: #060b16; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;">
      <sc-for list="{{bands}}" as="b" hint-placeholder-count="4">
        <div style="position:absolute; top:0; bottom:0; left: {{b.left}}%; width: {{b.width}}%; background: {{b.fill}};"></div>
      </sc-for>

      <svg viewBox="{{viewBox}}" preserveAspectRatio="none" style="position:absolute; inset:0; width:100%; height:100%; display:block;">
        <path d="{{wavePath}}" fill="{{waveFill}}"></path>
      </svg>

      <sc-for list="{{marks}}" as="m" hint-placeholder-count="4">
        <div style="position:absolute; top:0; bottom:0; left: {{m.left}}%; width:1px; background: {{m.rule}};"></div>
      </sc-for>

      <div style="position:absolute; top:0; left:0; right:0; height:26px; background: linear-gradient(to bottom, rgba(6,11,22,0.92), rgba(6,11,22,0));"></div>

      <sc-for list="{{marks}}" as="m" hint-placeholder-count="4">
        <span style="position:absolute; top:6px; left: {{m.left}}%; transform: {{m.shift}}; padding: 0 5px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: {{m.color}}; white-space: nowrap;">{{m.label}}</span>
      </sc-for>

      <div style="position:absolute; top:0; bottom:0; right:0; width:2px; background: var(--accent);"></div>
      <span style="position:absolute; top:6px; right:9px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--accent);">now</span>
      <span style="position:absolute; bottom:6px; left:9px; font-family: var(--mono); font-size: 10px; color: var(--ink-faint);">{{resolution}}</span>
    </div>

    <!-- left column: meters, stats, capture -->
    <div style="display:flex; flex-direction:column; gap:16px;">
      <section style="background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <sc-for list="{{meters}}" as="mt" hint-placeholder-count="2">
            <div style="display: grid; grid-template-columns: 18px 1fr 62px; align-items: center; gap: 9px;">
              <span style="font-family: var(--mono); font-size: 11px; color: var(--ink-faint);">{{mt.n}}</span>
              <span style="position: relative; height: 9px; border-radius: 5px; background: var(--panel-2); overflow: hidden; display:block;">
                <span style="position:absolute; left:0; top:0; bottom:0; width: {{mt.w}}%; background: var(--accent); display:block;"></span>
              </span>
              <span style="font-family: var(--mono); font-size: 11px; color: var(--ink-dim); text-align: right;">{{mt.db}}</span>
            </div>
          </sc-for>
        </div>

        <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
          <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
            <div>
              <div style="font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint);">{{s.k}}</div>
              <div style="font-family: var(--mono); font-size: 14px; color: var(--ink);">{{s.v}}</div>
            </div>
          </sc-for>
        </div>
      </section>

      <section style="background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px;">
        <h2 style="margin: 0 0 12px; font-size: 13px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-dim);">Capture</h2>
        <div style="display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--panel-2); border-radius: 11px; padding: 4px;">
          <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
            <button type="button" onClick="{{o.pick}}" style="appearance:none; border:0; background: {{o.bg}}; color: {{o.fg}}; font-family: var(--mono); font-size: 13px; font-weight: 600; min-height: 40px; border-radius: 8px; cursor: pointer;">{{o.label}}</button>
          </sc-for>
        </div>
        <p style="margin: 9px 0 0; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--ink-faint);">{{readout}}</p>
        <button type="button" style="margin-top: 10px; width: 100%; min-height: 58px; border: 0; border-radius: 12px; background: var(--accent); color: #062015; font-family: var(--font); font-size: 17px; font-weight: 750; letter-spacing: .04em; cursor: pointer;">Capture</button>
      </section>
    </div>

    <!-- right column: takes -->
    <section style="background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px;">
      <h2 style="margin: 0 0 12px; font-size: 13px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-dim);">Takes</h2>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <sc-for list="{{takes}}" as="t" hint-placeholder-count="3">
          <div style="background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px;">
            <div style="display:flex; align-items:baseline; justify-content:space-between; gap:10px;">
              <span style="font-family: var(--mono); font-size: 13px; color: var(--ink);">{{t.name}}</span>
              <span style="font-family: var(--mono); font-size: 11px; color: var(--ink-faint);">{{t.meta}}</span>
            </div>
            <div style="margin-top:8px; height:38px; border-radius:6px; background:#060b16; overflow:hidden;">
              <svg viewBox="0 0 620 38" preserveAspectRatio="none" style="width:100%; height:100%; display:block;">
                <path d="{{t.path}}" fill="rgba(52,211,153,0.5)"></path>
              </svg>
            </div>
          </div>
        </sc-for>
      </div>
    </section>

  </div>
</div>
</x-dc>

  "demoSpeed": {"editor":"range","default":0,"min":0,"max":40,"step":1,"unit":"x","section":"Demo"},

  "edgeSeconds": {"editor":"range","default":1,"min":1,"max":20,"step":1,"unit":"s","section":"Axis"},
  "$preview": {"width":1280,"height":800}
}'>

class Component extends DCLogic {
  componentDidMount() {
    this.start = Date.now();
    this.timer = setInterval(() => this.forceUpdate(), 140);
  }
  componentWillUnmount() { clearInterval(this.timer); }

  // A REAL 15-minute capture of the ring: jam_2026-09-08_233045.wav, 45000
  // bins at 20ms. Age maps straight onto the file -- end of file is now, start
  // of file is 900s ago -- so every passage sits where it actually happened,
  // at its real length, with the real silence between. Nothing is arranged.
  //
  // Each byte is dBFS over a -60..0 floor, which is exactly meter.js's
  // (db - FLOOR_DB) / -FLOOR_DB, so byte/255 is the value the live visualiser
  // would have drawn.
  data() {
    if (!this._d) {
      const s = atob(ENV_B64);
      this._d = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) this._d[i] = s.charCodeAt(i);
    }
    return this._d;
  }

  // drift ages everything: raising demoSpeed pushes content leftward and lets
  // silence enter from the right, which is what actually happens as you wait.
  level(age) {
    const d = this.data();
    const i = d.length - Math.round(age * 50);
    return (i < 0 || i >= d.length) ? 0 : d[i] / 255;
  }

  // Seconds of signal inside a span, so the readout can say outright whether
  // an option would capture anything.
  signalIn(span, drift) {
    const d = this.data();
    let n = 0;
    for (let a = 0; a < span; a += 0.02) {
      if (this.level(a + drift) > 0.233) n++;   // 0.233*60-60 = -46 dBFS
    }
    return n * 0.02;
  }

  envelopePath(W, H, pad, drift, T, AMIN, span, N) {
    const mid = H / 2, top = [], bot = [];
    for (let i = 0; i <= N; i++) {
      const x = i / N;
      const age = AMIN * Math.pow(T / AMIN, 1 - x);
      const a = this.level(age + drift) * (mid - pad);
      top.push((x * W).toFixed(1) + ',' + (mid - a).toFixed(1));
      bot.push((x * W).toFixed(1) + ',' + (mid + a).toFixed(1));
    }
    return 'M' + top.join(' L') + ' L' + bot.reverse().join(' L') + ' Z';
  }

  // A take thumbnail on a linear axis, the way the takes list already draws it.
  linearPath(fromAge, toAge, W, H) {
    const mid = H / 2, N = 240, top = [], bot = [];
    for (let i = 0; i <= N; i++) {
      const age = fromAge + (toAge - fromAge) * (i / N);
      const v = this.level(age) * (mid - 3);
      top.push(((i / N) * W).toFixed(1) + ',' + (mid - v).toFixed(1));
      bot.push(((i / N) * W).toFixed(1) + ',' + (mid + v).toFixed(1));
    }
    return 'M' + top.join(' L') + ' L' + bot.reverse().join(' L') + ' Z';
  }

  renderVals() {
    const T = Math.max(60, (this.props.ringMinutes ?? 15) * 60);
    const speed = this.props.demoSpeed ?? 0;
    const drift = ((Date.now() - (this.start ?? Date.now())) / 1000) * speed;

    const AMIN = Math.max(1, this.props.edgeSeconds ?? 1);
    const span = Math.log(T / AMIN);
    const leftPct = (age) => (1 - Math.log(Math.max(age, AMIN) / AMIN) / span) * 100;

    const W = 1246, H = 190;
    const wavePath = this.envelopePath(W, H, 16, drift, T, AMIN, span, 420);

    const picked = this.state?.picked ?? 30;
    const stops = [
      { label: '30s', s: 30 }, { label: '2m', s: 120 },
      { label: '7m', s: 420 }, { label: 'Full', s: T },
    ].filter((o) => o.s <= T);

    const bands = stops.map((o) => {
      const l = leftPct(o.s);
      return {
        left: l.toFixed(2), width: (100 - l).toFixed(2),
        fill: o.s === picked ? 'rgba(52,211,153,0.13)' : 'transparent',
      };
    });
    const marks = stops.map((o, i) => ({
      label: o.label === 'Full' ? this.fmt(T) : o.label,
      left: leftPct(o.s).toFixed(2),
      color: o.s === picked ? '#34d399' : '#5d6b85',
      rule: o.s === picked ? 'rgba(52,211,153,0.55)' : 'rgba(38,50,74,0.9)',
      shift: i === stops.length - 1 ? 'translateX(0)' : 'translateX(-50%)',
    }));
    const opts = stops.map((o) => ({
      label: o.label === 'Full' ? 'Full ' + this.fmt(T) : o.label,
      bg: o.s === picked ? 'var(--panel)' : 'transparent',
      fg: o.s === picked ? 'var(--accent)' : 'var(--ink-dim)',
      pick: () => this.setState({ picked: o.s }),
    }));

    const pk = stops.find((o) => o.s === picked) ?? stops[0];
    const sig = this.signalIn(pk.s, drift);
    const readout = sig < 0.5
      ? 'the last ' + this.fmt(pk.s) + ' — SILENT, this would save nothing'
      : 'the last ' + this.fmt(pk.s) + ' — ' + sig.toFixed(0) + 's of signal';

    const live = this.level(drift);
    const db = (v) => (v <= 0 ? '-60.0' : (v * 60 - 60).toFixed(1));

    return {
      wavePath, bands, marks, opts, readout,
      viewBox: '0 0 ' + W + ' ' + H,
      waveFill: 'rgba(52,211,153,0.72)',
      resolution: 'oldest edge ≈ ' + (T * span / W).toFixed(1) + ' s/px  ·  ribbon ' + W + 'px',
      takes: [
        { name: 'jam_2026-09-08_233045.wav', meta: '15m · full ring',
          path: this.linearPath(900, 0, 620, 38) },
        { name: 'jam_2026-09-08_232635.wav', meta: '2m',
          path: this.linearPath(120, 0, 620, 38) },
      ],
      meters: [
        { n: '1', w: (live * 100).toFixed(0), db: db(live) },
        { n: '2', w: (live * 94).toFixed(0), db: db(live * 0.94) },
      ],
      stats: [
        { k: 'buffered', v: this.fmt(T) },
        { k: 'xruns', v: '0' },
        { k: 'free', v: '17.7G' },
      ],
    };
  }

  fmt(s) { return s >= 60 ? (s / 60) + 'm' : s + 's'; }
}
</script>
